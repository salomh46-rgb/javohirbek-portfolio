<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/'" />
    <title>Redirecting...</title>
    <script>
      (() => {
        const redirect = sessionStorage.redirect || '/';
        sessionStorage.redirect = redirect;
        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
